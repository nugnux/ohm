<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR 2D Floating Display</title>

  <!-- 1. A-Frame: Core 3D engine -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- 2. MindAR: Tracks your image marker -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- 3. Look-At Component: Forces the 2D panel to always face the screen -->
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- The AR Scene -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <!-- Asset Preloading -->
    <a-assets>
      <img id="statusIcon" src="./assets/icon.png">
    </a-assets>

    <!-- Camera Entity -->
    <a-camera id="mainCamera" position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Anchor: Everything inside here attaches to your physical image -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Floating Container: Hovering 0.6m above target and facing the camera -->
      <a-entity position="0 0.6 0" look-at="#mainCamera">

        <!-- 2D Background Panel (Dark Card) -->
        <a-plane 
          width="1.2" 
          height="0.6" 
          color="#1E293B" 
          material="opacity: 0.9; transparent: true">
        </a-plane>

        <!-- 2D Image / Icon Overlay -->
        <a-image 
          src="#statusIcon" 
          position="-0.38 0 0.02" 
          width="0.3" 
          height="0.3">
        </a-image>

        <!-- Static Header Label -->
        <a-text 
          value="LIVE READING" 
          position="-0.15 0.12 0.02" 
          scale="0.35 0.35 0.35" 
          color="#94A3B8" 
          font="roboto">
        </a-text>

        <!-- Dynamic Floating Variable -->
        <a-text 
          id="liveVariable" 
          value="0.00 V" 
          position="-0.15 -0.08 0.02" 
          scale="0.75 0.75 0.75" 
          color="#38BDF8" 
          font="roboto">
        </a-text>

      </a-entity>

    </a-entity>
  </a-scene>

  <!-- Load update script -->
  <script src="./app.js"></script>
</body>
</html>
