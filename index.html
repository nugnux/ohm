<!-- Target Anchor -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Main Container: Positioned slightly above the marker, facing camera -->
      <a-entity position="0 0 0.05" look-at="#mainCamera">

        <!-- 1. Transparent Board Image Overlay -->
        <a-plane 
          src="#boardOverlay" 
          width="1.0" 
          height="1.0" 
          material="opacity: 0.55; transparent: true; alphaTest: 0.01;">
        </a-plane>

        <!-- 2. Compact HUD Card (Placed directly to the right of the resistor) -->
        <!-- Resistor center is ~ (0.16, 0.06); Placing readout card at (0.34, 0.06) -->
        <a-entity position="0.34 0.06 0.01">

          <!-- Semi-transparent dark background card for readability -->
          <a-plane 
            width="0.26" 
            height="0.22" 
            color="#0F172A" 
            material="opacity: 0.8; transparent: true">
          </a-plane>

          <!-- Component Label -->
          <a-text 
            value="R1 SENSOR" 
            align="center" 
            position="0 0.075 0.01" 
            scale="0.18 0.18 0.18" 
            color="#94A3B8" 
            font="roboto">
          </a-text>

          <!-- Divider line between label and metrics -->
          <a-plane 
            position="0 0.055 0.01" 
            width="0.22" 
            height="0.003" 
            color="#334155">
          </a-plane>

          <!-- VOLTAGE READING (Compact) -->
          <a-text 
            value="V:" 
            position="-0.10 0.015 0.01" 
            scale="0.22 0.22 0.22" 
            color="#94A3B8" 
            font="roboto">
          </a-text>
          <a-text 
            id="voltageDisplay" 
            value="3.32 V" 
            align="right" 
            position="0.10 0.015 0.01" 
            scale="0.25 0.25 0.25" 
            color="#38BDF8" 
            font="roboto">
          </a-text>

          <!-- CURRENT READING (Compact) -->
          <a-text 
            value="I:" 
            position="-0.10 -0.045 0.01" 
            scale="0.22 0.22 0.22" 
            color="#94A3B8" 
            font="roboto">
          </a-text>
          <a-text 
            id="currentDisplay" 
            value="10.6 mA" 
            align="right" 
            position="0.10 -0.045 0.01" 
            scale="0.25 0.25 0.25" 
            color="#818CF8" 
            font="roboto">
          </a-text>

          <!-- Small pointer indicator pointing left toward the resistor -->
          <a-triangle 
            vertex-a="-0.13 0 0" 
            vertex-b="-0.16 0 0" 
            vertex-c="-0.13 0.02 0" 
            color="#38BDF8" 
            material="opacity: 0.85;">
          </a-triangle>

        </a-entity>

      </a-entity>

    </a-entity>
