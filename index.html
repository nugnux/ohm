<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Engineering Overlay</title>
    
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- MindAR for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <!-- Look-At Component for facing the camera -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <!--
      Scene Configuration:
      - color-space/renderer: set for realistic 3D
      - ui: disabled for clean view
      - imageTargetSrc: links to your compiled marker
    -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">

        <!-- Preload any assets if needed (icons, specific fonts) -->
        <a-assets></a-assets>

        <!-- The Camera -->
        <a-camera id="mainCamera" position="0 0 0" look-controls="enabled: false"></a-camera>

        <!--
          Target Anchor (targetIndex: 0 matches image_0.png)
          All children are positioned relative to this image.
        -->
        <a-entity id="arAnchor" mindar-image-target="targetIndex: 0">
            
            <!--
              [THE OVERLAY]
              A semi-transparent, billboarded container anchored above the component.
              This whole structure always faces the camera (#mainCamera).
              - Position x:0, y:0.6 (height above marker), z:0.0
            -->
            <a-entity id="engineeringOverlay" position="0 0.6 0.0" look-at="#mainCamera">

                <!-- 1. Background Panel: Adds contrast to the text.
                   Color: Darker blue-grey, semi-transparent (opacity 0.85) -->
                <a-plane 
                    id="overlayBackground"
                    width="1.2" 
                    height="0.6" 
                    color="#1E293B" 
                    material="opacity: 0.85; transparent: true">
                </a-plane>

                <!-- 2. Voltage Value Panel -->
                <a-entity position="0 0.15 0.01">
                    <a-text 
                        id="voltValue"
                        value="3.30 V" 
                        color="#38BDF8" 
                        scale="0.8 0.8 0.8" 
                        align="center" 
                        font="roboto">
                    </a-text>
                    <a-text 
                        value="LIVE" 
                        color="#38BDF8" 
                        scale="0.3 0.3 0.3" 
                        align="center" 
                        position="0.35 0.05 0">
                    </a-text>
                </a-entity>

                <!-- 3. Current Value Panel -->
                <a-entity position="0 -0.15 0.01">
                    <a-text 
                        id="currValue"
                        value="10.5 mA" 
                        color="#818CF8" 
                        scale="0.8 0.8 0.8" 
                        align="center" 
                        font="roboto">
                    </a-text>
                    <a-text 
                        value="CALC" 
                        color="#818CF8" 
                        scale="0.3 0.3 0.3" 
                        align="center" 
                        position="0.35 -0.05 0">
                    </a-text>
                </a-entity>

            </a-entity>

        </a-entity>
    </a-scene>

    <!-- Include the control script (see Step 3) -->
    <script src="./app.js"></script>

</body>
</html>
